name: build-rust

on:
  workflow_dispatch:
    inputs:
      build_id:
        description: "Build ID"
        required: false
        default: "latest"
        type: string
  push:
    paths:
      - "rust-relay/**"
      - ".github/workflows/build-rust.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust + Windows GNU target
        shell: bash
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          source $HOME/.cargo/env
          rustup target add x86_64-pc-windows-gnu

      - name: Install MinGW cross-compiler
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-mingw-w64-x86-64

      - name: Build for Windows (GNU)
        shell: bash
        run: |
          source $HOME/.cargo/env
          cd rust-relay
          cargo build --release --target x86_64-pc-windows-gnu
          echo "Build complete"
          ls -la target/x86_64-pc-windows-gnu/release/

      - name: Package binary
        shell: bash
        run: |
          source $HOME/.cargo/env
          BINARY=rust-relay/target/x86_64-pc-windows-gnu/release/blackout-relay.exe
          # If .exe not found, try without extension
          if [ ! -f "$BINARY" ]; then
            BINARY=rust-relay/target/x86_64-pc-windows-gnu/release/blackout-relay
          fi
          mkdir -p releases
          base64 -w0 $BINARY > releases/blackout-relay.b64
          echo "Binary size: $(wc -c < $BINARY) bytes"
          echo "Base64 size: $(wc -c < releases/blackout-relay.b64) bytes"
          sha256sum $BINARY | cut -d' ' -f1 > releases/blackout-relay.sha256

      - name: Commit binary
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p releases
          git add releases/
          git commit -m "Build binary: fix-4" --allow-empty || true
          git push
