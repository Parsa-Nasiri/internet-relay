name: relay

on:
  workflow_dispatch:
    inputs:
      request_id:
        description: "Request ID"
        required: true
        type: string
      method:
        description: "HTTP method"
        required: false
        default: "GET"
        type: choice
        options: [GET, POST, HEAD, OPTIONS]
      url:
        description: "URL to fetch (or leave empty for requests/<id>.json)"
        required: false
        default: ""
        type: string
      headers:
        description: "JSON headers (optional)"
        required: false
        default: "{}"
        type: string

permissions:
  contents: write
  actions: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch URL
        id: fetch
        env:
          REQUEST_ID: ${{ inputs.request_id }}
          METHOD: ${{ inputs.method }}
          URL: ${{ inputs.url }}
          HEADERS_JSON: ${{ inputs.headers }}
        run: |
          mkdir -p responses
          
          # Resolve URL: use input, or fall back to request file
          if [ -z "$URL" ]; then
            REQUEST_FILE="requests/$REQUEST_ID.json"
            if [ ! -f "$REQUEST_FILE" ]; then
              echo "No URL provided and no request file found"
              exit 1
            fi
            URL=$(jq -r '.url' "$REQUEST_FILE")
            METHOD=$(jq -r '.method // "GET"' "$REQUEST_FILE")
            HEADERS_JSON=$(jq -r '.headers // "{}"' "$REQUEST_FILE")
          fi
          echo "Fetching: $METHOD $URL"

          # Convert JSON headers to curl -H flags
          HEADER_ARGS=()
          if [ "$HEADERS_JSON" != "{}" ] && [ -n "$HEADERS_JSON" ]; then
            while IFS='=' read -r key value; do
              [ -n "$key" ] && HEADER_ARGS+=(-H "$key: $value")
            done < <(echo "$HEADERS_JSON" | jq -r 'to_entries[] | "\(.key)=\(.value)"')
          fi

          # Fetch
          HTTP_CODE=$(curl -s -L --connect-timeout 30 --max-time 60 "${HEADER_ARGS[@]}" \
            -D "responses/${REQUEST_ID}.headers" \
            -o "responses/${REQUEST_ID}.txt" \
            -w "%{http_code}" \
            -X "$METHOD" \
            "$URL")
          
          echo "HTTP_CODE=$HTTP_CODE" > "responses/${REQUEST_ID}.meta"
          echo "URL=$URL" >> "responses/${REQUEST_ID}.meta"
          echo "METHOD=$METHOD" >> "responses/${REQUEST_ID}.meta"
          
          echo "=== Status: $HTTP_CODE ==="
          echo "=== Response size ==="
          wc -c < "responses/${REQUEST_ID}.txt"

      - name: Commit and push
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "relay response: ${{ inputs.request_id }}" --allow-empty 2>&1 || true
          git push origin HEAD:${{ github.ref_name }} 2>&1 || true
