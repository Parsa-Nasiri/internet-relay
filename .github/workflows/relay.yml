name: relay

on:
  workflow_dispatch:
    inputs:
      request_id:
        description: "Request ID"
        required: true
        type: string
      method:
        description: "HTTP method"
        required: false
        default: "GET"
        type: choice
        options: [GET, POST, HEAD, OPTIONS]
      url:
        description: "URL to fetch (or leave empty for requests/<id>.json)"
        required: false
        default: ""
        type: string
      headers:
        description: "JSON headers (optional)"
        required: false
        default: "{}"
        type: string
  push:
    paths:
      - "requests/**"

permissions:
  contents: write
  actions: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch URL
        env:
          REQUEST_ID: ${{ github.event_name == 'push' && github.ref_name || inputs.request_id }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: |
          mkdir -p responses
          
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            # Find the request file that was just pushed
            REQUEST_ID=$(ls requests/*.json 2>/dev/null | head -1 | sed 's/requests\///;s/\.json//')
            if [ -z "$REQUEST_ID" ]; then
              echo "No request files found"
              exit 0
            fi
          fi
          
          REQUEST_FILE="requests/$REQUEST_ID.json"
          if [ -f "$REQUEST_FILE" ]; then
            URL=$(jq -r '.url' "$REQUEST_FILE")
            METHOD=$(jq -r '.method // "GET"' "$REQUEST_FILE")
            HEADERS_JSON=$(jq -r '.headers // "{}"' "$REQUEST_FILE")
          else
            URL="${{ inputs.url }}"
            METHOD="${{ inputs.method }}"
            HEADERS_JSON="${{ inputs.headers }}"
          fi
          
          echo "Fetching: $METHOD $URL"

          # Build curl header args
          HEADER_ARGS=""
          echo "$HEADERS_JSON" | jq -r 'to_entries[]? | "-H \(.key): \(.value)"' 2>/dev/null | while IFS= read -r h; do
            [ -n "$h" ] && echo "$h"
          done > /tmp/_headers.txt
          if [ -s /tmp/_headers.txt ]; then
            HEADER_ARGS=$(cat /tmp/_headers.txt | tr '\n' ' ')
          fi

          # Fetch the URL
          HTTP_CODE=$(curl -s -L --connect-timeout 30 --max-time 60 $HEADER_ARGS \
            -D "responses/${REQUEST_ID}.headers" \
            -o "responses/${REQUEST_ID}.txt" \
            -w "%{http_code}" \
            -X "$METHOD" \
            "$URL")
          
          echo "HTTP_CODE=$HTTP_CODE" > "responses/${REQUEST_ID}.meta"
          echo "URL=$URL" >> "responses/${REQUEST_ID}.meta"
          echo "METHOD=$METHOD" >> "responses/${REQUEST_ID}.meta"
          
          echo "=== Status: $HTTP_CODE ==="
          echo "=== Response size ==="
          wc -c < "responses/${REQUEST_ID}.txt"
          
          # Remove the request file so it doesn't trigger again
          rm -f "$REQUEST_FILE"

      - name: Commit and push
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "relay response: ${{ inputs.request_id }}" --allow-empty 2>&1 || true
          git push origin HEAD:${{ github.ref_name }} 2>&1 || true
